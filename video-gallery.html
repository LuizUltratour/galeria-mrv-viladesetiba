<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria de Vídeos — MRV Vila de Setiba</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* MRV Vila de Setiba — tema verde imersivo */
      --bg:            #002E1D;
      --surface:       #073C28;
      --dark:          #EAFFF7;
      --border:        rgba(234,255,247,0.12);
      --border-strong: rgba(234,255,247,0.28);
      --accent:        #EAFFF7;
      --accent-ink:    #002E1D;
      --font-sans:     'Inter', system-ui, sans-serif;
      --ease:          cubic-bezier(0.4, 0, 0.2, 1);
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--dark);
      font-family: var(--font-sans);
    }

    #vg-root { display: flex; flex-direction: column; height: 100vh; height: 100dvh; background: var(--bg); }

    /* ── HEADER ── */
    #vg-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 12px;
    }

    #vg-tabs {
      display: flex;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      overflow-x: auto;
      max-width: 100%;
    }

    .vg-tab {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
      color: rgba(234,255,247,0.6);
      transition: background 0.2s var(--ease), color 0.2s var(--ease);
      white-space: nowrap;
    }
    @media (hover: hover) { .vg-tab:hover { color: var(--dark); } }
    .vg-tab.active { background: var(--accent); color: var(--accent-ink); }

    #btn-close {
      width: 36px; height: 36px;
      border: 1px solid var(--border-strong);
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      color: var(--dark);
      transition: background 0.25s var(--ease), color 0.25s var(--ease);
      flex-shrink: 0;
    }
    @media (hover: hover) { #btn-close:hover { background: var(--dark); color: var(--bg); border-color: var(--dark); } }
    #btn-close:active { background: var(--dark); color: var(--bg); border-color: var(--dark); }

    /* ── PAINÉIS ── */
    .tab-panel {
      display: none;
      flex: 1;
      min-height: 0;
      background: #000;
      align-items: center;
      justify-content: center;
    }
    .tab-panel.active { display: flex; }

    .hero-player {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      outline: none;
    }

    /* ── MOBILE ── */
    @media (max-width: 600px) {
      #vg-header { flex-wrap: wrap; padding: 10px 14px 8px; row-gap: 8px; }
      #btn-close { order: 1; margin-left: auto; }
      #vg-tabs   { order: 2; width: 100%; }
      .vg-tab    { flex: 1; text-align: center; padding: 7px 10px; }
    }
  </style>
</head>
<body>

<div id="vg-root">
  <header id="vg-header">
    <div id="vg-tabs" role="tablist">
      <button class="vg-tab active" data-tab="produto"    role="tab">Produto</button>
      <button class="vg-tab"        data-tab="lancamento" role="tab">Clipe Lançamento</button>
      <button class="vg-tab"        data-tab="vertical"   role="tab">Clipe Vertical</button>
      <button class="vg-tab"        data-tab="vem-ai"     role="tab">Vem aí</button>
    </div>

    <button id="btn-close" title="Fechar" aria-label="Fechar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </header>

  <!-- Para trocar/adicionar vídeo: ajuste o botão acima e o painel abaixo (ver README) -->
  <div id="tab-produto" class="tab-panel active" role="tabpanel">
    <video class="hero-player" data-tab="produto" src="assets/videos/produto.mp4"
           autoplay muted playsinline controls preload="auto"></video>
  </div>

  <div id="tab-lancamento" class="tab-panel" role="tabpanel">
    <video class="hero-player" data-tab="lancamento" src="assets/videos/clipe-lancamento-horizontal.mp4"
           playsinline controls preload="none"></video>
  </div>

  <div id="tab-vertical" class="tab-panel" role="tabpanel">
    <video class="hero-player" data-tab="vertical" src="assets/videos/clipe-lancamento-vertical.mp4"
           playsinline controls preload="none"></video>
  </div>

  <div id="tab-vem-ai" class="tab-panel" role="tabpanel">
    <video class="hero-player" data-tab="vem-ai" src="assets/videos/vem-ai.mp4"
           playsinline controls preload="none"></video>
  </div>
</div>

<script>
// ── abas: um vídeo por aba ──────────────────────────────────────
const heroes = Array.from(document.querySelectorAll('.hero-player'));
const heroFor = tab => heroes.find(v => v.dataset.tab === tab);

document.querySelectorAll('.vg-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;

    document.querySelectorAll('.vg-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');

    // pausa os outros e toca o vídeo da aba ativa
    heroes.forEach(v => { if (v.dataset.tab !== tab) v.pause(); });
    const h = heroFor(tab);
    if (h) h.play().catch(() => {});
  });
});

// ── fechar ──────────────────────────────────────────────────────
document.getElementById('btn-close').addEventListener('click', closeGallery);

function closeGallery() {
  heroes.forEach(v => v.pause());
  if (window.parent !== window) {
    window.parent.postMessage({ action: 'closeGallery' }, '*');
  } else if (window.history.length > 1) {
    history.back();
  } else {
    window.close();
  }
}
</script>
</body>
</html>
